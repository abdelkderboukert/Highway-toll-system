name: CI Pipeline

on:
  push:
    branches:
      - development
      - main
      - dev-*
  pull_request:
    branches:
      - development
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "20"
  RUST_VERSION: "stable"

jobs:
  # ==========================================
  # AI Microservice
  # ==========================================
  lint-ai:
    name: AI - Code Linting & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install linting tools
        run: |
          pip install flake8 black isort

      - name: Check code formatting with Black
        run: black --check src/ main.py
        working-directory: AI

      - name: Lint with Flake8
        run: |
          flake8 src/ main.py --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 src/ main.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        working-directory: AI

  test-ai:
    name: AI - Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run unit tests
        run: |
          pytest AI/tests/ -v --cov=src --cov-report=xml --cov-report=html

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  build-ai:
    name: AI - Build Application
    runs-on: ubuntu-latest
    needs: [lint-ai, test-ai]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile main.py src/*.py
        working-directory: AI
        continue-on-error: true

      - name: Verify configuration files
        run: |
          python -c "import yaml; yaml.safe_load(open('config/config.yaml'))"
        working-directory: AI

      - name: Build artifact (if applicable)
        run: |
          mkdir -p build/
          cp -r src/ main.py ../requirements.txt build/
          echo "Build completed successfully"
        working-directory: AI

  # ==========================================
  # UI/Backend Microservice
  # ==========================================
  lint-backend:
    name: Backend - Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - run: pip install flake8 black
      - run: black --check .
        working-directory: UI/backend
        continue-on-error: true
      - run: flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics
        working-directory: UI/backend

  test-backend:
    name: Backend - Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install django
        working-directory: UI/backend
      - run: python manage.py test
        working-directory: UI/backend
        continue-on-error: true

  build-backend:
    name: Backend - Build
    runs-on: ubuntu-latest
    needs: [lint-backend, test-backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - run: python -m py_compile manage.py api/*.py core/*.py || true
        working-directory: UI/backend

  # ==========================================
  # UI/Frontend Microservice
  # ==========================================
  lint-frontend:
    name: Frontend - Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "UI/frontend/package-lock.json"
      - run: npm ci
        working-directory: UI/frontend
      - run: npm run lint
        working-directory: UI/frontend

  build-frontend:
    name: Frontend - Build
    runs-on: ubuntu-latest
    needs: [lint-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "UI/frontend/package-lock.json"
      - run: npm ci
        working-directory: UI/frontend
      - run: npm run build
        working-directory: UI/frontend

  # ==========================================
  # Export_Middleman Microservice
  # ==========================================
  lint-export:
    name: Export - Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Export_Middleman
      - run: cargo fmt -- --check
        working-directory: Export_Middleman
      - run: cargo clippy -- -D warnings || true
        working-directory: Export_Middleman

  test-export:
    name: Export - Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Export_Middleman
      - run: cargo test
        working-directory: Export_Middleman

  build-export:
    name: Export - Build
    runs-on: ubuntu-latest
    needs: [lint-export, test-export]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Export_Middleman
      - run: cargo build --release
        working-directory: Export_Middleman
