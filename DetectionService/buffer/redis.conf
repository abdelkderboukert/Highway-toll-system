# redis.conf — Buffer layer Redis FIFO queue configuration
# This is the central shock absorber between Stage 1 and Stage 2/3 workers.
#
# WARNING: Never modify the list data structure used for tasks without
# also updating buffer/keda_scaledobject.yaml and all LPUSH/BRPOP call sites.

# ─── Network ──────────────────────────────────────────────────────────────────
bind 0.0.0.0
port 6379
protected-mode yes

# ─── Authentication ────────────────────────────────────────────────────────────
# Actual password injected via Kubernetes Secret (requirepass is a placeholder).
# In local dev, set REDIS_PASSWORD env var or comment this out.
# requirepass CHANGE_ME

# ─── Persistence ──────────────────────────────────────────────────────────────
# AOF enabled for task durability — prevents queue loss on Redis restart.
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshots as a secondary safety net
save 900 1
save 300 10
save 60 10000
rdbcompression yes
dbfilename dump.rdb
dir /data

# ─── Memory management ────────────────────────────────────────────────────────
# Cap memory at 512 MB. If the queue fills up (tasks backlog > capacity),
# use allkeys-lru to evict the oldest entries rather than crash.
maxmemory 512mb
maxmemory-policy allkeys-lru

# ─── Queue health ─────────────────────────────────────────────────────────────
# Slow log — log commands taking > 10ms for queue-depth diagnostics
slowlog-log-slower-than 10000
slowlog-max-len 128

# Keyspace notifications for KEDA to read list lengths (required)
# K = keyspace events, l = list commands, x = expired key events
notify-keyspace-events "Klx"

# ─── Connection limits ────────────────────────────────────────────────────────
maxclients 100
tcp-keepalive 300
timeout 0

# ─── Logging ─────────────────────────────────────────────────────────────────
loglevel notice
logfile ""
